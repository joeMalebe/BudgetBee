apply plugin: 'com.android.application'

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.devtools.ksp'

android {
    compileSdk 36
    defaultConfig {
        applicationId "za.co.sqware.za.budgetbliss"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 7
        versionName "1.3"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        multiDexEnabled false
        lintOptions {
            warning 'InvalidPackage'
        }
    }

    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }

        debug{
            minifyEnabled false
            debuggable true
            multiDexEnabled true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_25
        targetCompatibility JavaVersion.VERSION_25
    }

    buildFeatures {
        viewBinding true
    }
    namespace 'za.co.sqware.za.budgetbliss'
}
repositories {
    maven { url "https://jitpack.io" }
}
dependencies {

    def room_version = "2.8.3"
    def rxAndroid_version = "2.1.1"

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.gms:play-services-plus:17.0.0'
    testImplementation 'junit:junit:4.13.2'
    debugImplementation 'com.android.support.test:runner:1.0.2'
    implementation 'com.android.support:design:34.0.0'
    implementation 'org.codejargon.feather:feather:1.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    //Room
    implementation "androidx.room:room-runtime:$room_version"

    // RxJava support for Room

    implementation "androidx.room:room-rxjava2:$room_version"

    implementation "io.reactivex.rxjava2:rxandroid:$rxAndroid_version"

    annotationProcessor "androidx.room:room-compiler:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.23.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.3.0'

}
